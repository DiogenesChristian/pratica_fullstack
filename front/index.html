<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f5c45">
    <title>Cadastro de Usuários</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Cadastro de Usuários</h1>
        <p>Gerencie os usuários cadastrados no sistema</p>
      </div>
    </header>

    <main class="container">
      <div class="coluna-formularios">
        <section class="painel">
          <h2 id="titulo-formulario">Novo usuário</h2>

          <form id="form-usuario">
            <input type="hidden" id="usuario-id">

            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" required>

            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" required>

            <label for="idade">Idade</label>
            <input id="idade" name="idade" type="number" min="0">

            <div class="acoes-formulario">
              <button type="submit" id="botao-salvar">Cadastrar</button>
              <button type="button" id="botao-cancelar" class="secundario oculto">
                Cancelar edição
              </button>
            </div>
          </form>
        </section>

        <section class="painel">
          <h2 id="titulo-form-pindorama">Pindorama</h2>

          <form id="form-pindorama">
            <input type="hidden" id="pindorama-id">

            <label for="pindorama-user">Usuário</label>
            <select id="pindorama-user" required>
              <option value="">Carregando usuários...</option>
            </select>

            <div class="checkbox-line">
              <input id="pindorama-residente" name="residente" type="checkbox">
              <label for="pindorama-residente">Residente</label>
            </div>

            <label for="pindorama-moradia">Moradia</label>
            <input id="pindorama-moradia" name="moradia" type="text" required>

            <label for="pindorama-valor">Valor</label>
            <input id="pindorama-valor" name="valor" type="number" min="0" step="0.01">

            <div class="acoes-formulario">
              <button type="submit" id="botao-salvar-pindorama">Salvar</button>
              <button type="button" id="botao-cancelar-pindorama" class="secundario oculto">Cancelar</button>
            </div>
          </form>
        </section>
      </div>

      <div class="coluna-listas">
        <section class="painel">
          <div class="cabecalho-lista">
            <h2>Usuários</h2>
            <button type="button" id="botao-atualizar" class="secundario">Atualizar lista</button>
          </div>

          <form id="form-busca" class="busca">
            <label for="busca-id">Buscar usuário pelo ID</label>
            <div class="linha-busca">
              <input id="busca-id" type="text" placeholder="Informe o ID do usuário">
              <button type="submit">Buscar</button>
              <button type="button" id="botao-limpar-busca" class="secundario">Listar todos</button>
            </div>
          </form>

          <p id="mensagem" role="status" aria-live="polite"></p>
          <div id="lista-usuarios" class="lista-usuarios"></div>
        </section>

        <section class="painel">
          <div class="cabecalho-lista">
            <h3>Registros Pindorama</h3>
            <button type="button" id="botao-atualizar-pindorama" class="secundario">Atualizar</button>
          </div>

          <p id="mensagem-pindorama" role="status" aria-live="polite"></p>
          <div id="lista-pindorama" class="lista-usuarios"></div>
        </section>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
